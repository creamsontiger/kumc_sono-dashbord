<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초음파 컨설트 대시보드 V5.3 (실시간 공유)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (실시간 데이터베이스 연동용) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- 깜빡임 방지: 저장된 테마(없으면 시스템 설정)를 렌더링 전에 적용 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('ultrasound_consult_dashboard_theme');
                if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>
    <!-- Pretendard Variable: 한글 UI용 가변 폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <!-- Google Fonts (대체) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS (Excel Library) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard Variable', 'Pretendard', 'Noto Sans KR', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #ECF0F2; --surface: #FFFFFF; --surface-2: #F4F7F8;
            --ink: #0A1A24; --ink-2: #3A4E5C; --ink-3: #66798A;
            --line: #DAE2E7; --line-strong: #B8C5CD;
            --brand: #2A56D8; --brand-soft: #E7EEFD;
            --bar: #0A1A24; --bar-ink: #E8F0F4;
            --done: #0B64B8; --on-done: #FFFFFF; --done-soft: #E3EEFA;
            --re-bar: #E8A200; --on-re: #2B1A00; --re-soft: #FFF2CC;
            --dc: #BF4A00; --on-dc: #FFFFFF; --dc-soft: #FBE7DA;
            --neck: #A8477F; --chest: #1A7FC4; --abd: #00805C; --msk: #B87400;
            --th0: #0072B2; --th1: #E69F00; --th2: #CC79A7; --th3: #F0E442; --tstep: 8%;
            --shadow: 0 1px 2px rgba(10,26,36,.06), 0 10px 28px -18px rgba(10,26,36,.30);
            color-scheme: light;
        }
        html[data-theme="dark"] {
            --bg: #08121A; --surface: #0E1C26; --surface-2: #132531;
            --ink: #E5EEF3; --ink-2: #A9BBC7; --ink-3: #7C909E;
            --line: #1E3140; --line-strong: #2F4859;
            --brand: #7497FF; --brand-soft: #15284F;
            --bar: #060E14; --bar-ink: #E8F0F4;
            --done: #5BB0F0; --on-done: #04162A; --done-soft: #0E2438;
            --re-bar: #F2C230; --on-re: #2B1A00; --re-soft: #33290A;
            --dc: #FF8F4D; --on-dc: #2E1100; --dc-soft: #3A1D0B;
            --neck: #E59BC6; --chest: #6CC0F0; --abd: #2DD1A0; --msk: #F3B64A;
            --th0: #4DA3E0; --th1: #F0A91A; --th2: #D98BB8; --th3: #E8DC4A; --tstep: 6%;
            --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.7);
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }
        * { word-break: keep-all; }
        html, body { height: 100%; }
        body.v5 {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif;
            font-size: 14px; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid var(--surface); }
        :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
        select option { background: var(--surface); color: var(--ink); }

        input[type=file] { display: none; }
        .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        .main { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 16px; }

        .appbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; padding: 10px 20px; background: var(--bar); color: var(--bar-ink); }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none;
            background: linear-gradient(155deg, color-mix(in oklab, var(--brand) 88%, #fff), color-mix(in oklab, var(--brand) 70%, #000)); }
        .brand-mark svg { width: 24px; height: 24px; }
        .brand h1 { font-size: 17px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; margin: 0; white-space: nowrap; }
        .brand p { font-size: 11.5px; color: color-mix(in oklab, var(--bar-ink) 60%, transparent); margin: 2px 0 0; white-space: nowrap; }
        .appbar-date { display: flex; align-items: center; gap: 8px; }
        .seg { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.08); }
        .seg button, .seg input[type=date] { height: 30px; border-radius: 9px; border: 0; background: transparent; color: var(--bar-ink); font: 600 13px/1 inherit; font-family: inherit; padding: 0 12px; cursor: pointer; transition: background .15s, color .15s; }
        .seg button:hover, .seg input[type=date]:hover { background: rgba(255,255,255,.1); }
        .seg .is-active { background: var(--surface); color: var(--ink); }
        .seg input[type=date] { padding: 0 8px; color-scheme: dark; }
        .seg input[type=date].is-active { color-scheme: light; }
        .date-label { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: color-mix(in oklab, var(--bar-ink) 75%, transparent); white-space: nowrap; }
        .appbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 10px; border: 1px solid transparent; font: 600 13px/1 inherit; font-family: inherit; white-space: nowrap; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: .35; cursor: not-allowed; }
        .btn-bar { color: var(--bar-ink); background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.10); }
        .btn-bar:hover:not(:disabled) { background: rgba(255,255,255,.15); }
        .btn-bar-icon { width: 34px; padding: 0; }
        .btn-save { background: var(--done); color: var(--on-done); }
        .btn-save:hover { filter: brightness(1.08); }
        .btn-danger-ghost:hover { background: color-mix(in oklab, var(--dc) 30%, transparent); border-color: var(--dc); }
        .bar-divider { width: 1px; height: 20px; background: rgba(255,255,255,.14); margin: 0 4px; }
        .backup-status { font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: color-mix(in oklab, var(--bar-ink) 65%, transparent); margin-right: 2px; white-space: nowrap; }
        .backup-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
        .backup-status[data-state="ok"]::before { background: var(--done); }
        .backup-status[data-state="warn"] { color: var(--re-bar); }
        .backup-status[data-state="warn"]::before { background: var(--re-bar); }
        .backup-status:empty { display: none; }

        .notice { display: none; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 9px 14px; border-radius: 12px; font-size: 13px; font-weight: 600;
            background: var(--re-soft); color: var(--ink); border: 1px solid color-mix(in oklab, var(--re-bar) 55%, transparent); }
        .notice.is-visible { display: flex; }
        .notice i { color: var(--re-bar); margin-right: 8px; }
        .notice button { height: 30px; padding: 0 12px; border-radius: 99px; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 12.5px; cursor: pointer; }

        .summary-cap { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
        .summary-cap h2 { font-size: 14px; font-weight: 700; margin: 0; }
        .summary-cap span { font-size: 12px; color: var(--ink-3); }
        .summary { display: grid; grid-template-columns: 1fr 1fr 1.8fr 1.1fr; gap: 12px; }
        .sum-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 12px 18px; box-shadow: var(--shadow); overflow: hidden; }
        .sum-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--p); }
        .sum-neck { --p: var(--neck); } .sum-chest { --p: var(--chest); } .sum-abd { --p: var(--abd); } .sum-msk { --p: var(--msk); }
        .sum-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .sum-head h3 { font-size: 13px; font-weight: 700; color: var(--p); margin: 0; display: flex; align-items: center; gap: 7px; }
        .sum-total { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
        .sum-items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .sum-item { display: inline-flex; align-items: center; gap: 8px; padding: 3px 4px 3px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
        .sum-item button { min-width: 26px; height: 22px; padding: 0 7px; border-radius: 999px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer;
            color: var(--p); background: color-mix(in oklab, var(--p) 14%, var(--surface)); transition: background .15s, color .15s; }
        .sum-item button:hover { background: var(--p); color: var(--surface); }

        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .search { position: relative; flex: 1 1 220px; max-width: 320px; }
        .search i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 13px; pointer-events: none; }
        .search input { width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500; }
        .search input::placeholder { color: var(--ink-3); }
        .field { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 4px 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
        .field > span { font-size: 12px; font-weight: 600; color: var(--ink-3); }
        .field select { height: 34px; max-width: 170px; border: 0; background: transparent; color: var(--ink); font: 600 13.5px/1 inherit; font-family: inherit; padding: 0 6px 0 0; cursor: pointer; }
        .field:focus-within, .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in oklab, var(--brand) 22%, transparent); outline: none; }
        .toolbar-gap { flex: 1; }
        .filter-chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font: 600 13px/1 inherit; font-family: inherit; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
        .filter-chip:hover { border-color: var(--brand); color: var(--brand); }
        .filter-chip.is-on { background: var(--brand); border-color: var(--brand); color: #fff; }
        .filter-chip .count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
        .filter-chip.is-on .count { background: #fff; color: var(--brand); }
        .btn-primary { height: 38px; padding: 0 18px; border-radius: 12px; background: var(--brand); color: #fff; font: 700 14px/1 inherit; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 20px -12px color-mix(in oklab, var(--brand) 80%, transparent); transition: filter .15s, transform .1s; }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:active { transform: translateY(1px); }
        html[data-theme="dark"] .btn-primary, html[data-theme="dark"] .filter-chip.is-on { color: #06122E; }
        html[data-theme="dark"] .filter-chip.is-on .count { color: #06122E; }

        .panel { flex: 1; min-height: 300px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
        .panel-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
        .panel-head .btn-new { justify-self: center; height: 40px; padding: 0 22px; }
        .panel-title { display: flex; align-items: center; gap: 10px; justify-self: start; min-width: 0; flex-wrap: wrap; }
        .panel-title h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .panel-title h2 > span { font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
        .count-badge { padding: 2px 10px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .panel-tools { display: flex; align-items: center; gap: 12px; justify-self: end; }
        .hint { font-size: 12px; color: var(--ink-3); }
        .btn-soft { height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font: 600 12.5px/1 inherit; font-family: inherit; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; transition: background .15s, border-color .15s; }
        .btn-soft:hover { border-color: var(--brand); color: var(--brand); }
        .btn-soft.is-on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

        .table-scroll { flex: 1; min-height: 0; overflow: auto; }
        #consultTable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; text-align: left; }
        #consultTable thead th { position: sticky; top: 0; z-index: 3; padding: 9px 8px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 700; white-space: nowrap; border-bottom: 1px solid var(--line-strong); text-align: left; }
        #consultTable thead th.t-c { text-align: center; }
        #consultTable thead th.th-g1 { box-shadow: inset 0 3px 0 var(--brand); }
        #consultTable thead th.th-g2 { box-shadow: inset 0 3px 0 var(--ink-3); }
        #consultTable .g-start { border-left: 1px solid var(--line); }
        .th-sort { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
        .th-sort:hover { color: var(--brand); }
        .sort-ico { font-size: 10px; color: var(--line-strong); }
        .sort-ico.is-active { color: var(--brand); }

        #consultTable tbody td { padding: 7px 8px; vertical-align: middle; white-space: nowrap; border-bottom: 1px solid var(--line); background: var(--row-bg, var(--surface)); transition: background .12s; }
        #consultTable tbody tr:hover td { background: color-mix(in oklab, var(--row-bg, var(--surface)) 90%, var(--brand)); }
        #consultTable tbody tr td:first-child { box-shadow: inset 5px 0 0 var(--st, transparent); }
        #consultTable tr.part-end td { border-bottom: 2px solid var(--line-strong); }
        .row-todo { --st: transparent; }
        .row-done { --st: var(--done); --row-bg: var(--done-soft); color: var(--ink-3); }
        .row-re { --st: var(--re-bar); --row-bg: var(--re-soft); }
        .row-dc { --st: var(--dc); --row-bg: var(--dc-soft); }
        .c-seq { text-align: center; color: var(--ink-3); font-variant-numeric: tabular-nums; font-weight: 600; }
        .c-part, .c-chk, .c-status, .c-act { text-align: center; }
        .c-date { font-variant-numeric: tabular-nums; }
        .c-ward { font-weight: 700; }
        .c-room { font-weight: 600; color: var(--ink-2); }
        .c-id { font-variant-numeric: tabular-nums; font-weight: 600; }
        .date-tip { cursor: help; border-bottom: 1px dotted var(--line-strong); }
        .date-tip.date-diff { color: var(--re-bar); border-bottom-color: var(--re-bar); font-weight: 700; }
        .date-tip.date-diff i { font-size: 11px; margin-left: 2px; }
        .room-phone-hover { cursor: help; }
        .cell-flex { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .pt-name { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; color: var(--ink); cursor: help; min-width: 0; }
        .pt-name i { color: var(--ink-3); font-size: 14px; }
        .row-done .pt-name, .row-done .proc-text { color: var(--ink-3); }
        .row-re .pt-name, .row-dc .pt-name { text-decoration: line-through; text-decoration-thickness: 2px; }
        .row-re .pt-name { text-decoration-color: var(--re-bar); } .row-dc .pt-name { text-decoration-color: var(--dc); }
        .proc-text { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; color: var(--ink); min-width: 0; }
        .proc-text i { color: var(--brand); font-size: 13px; flex: none; }
        .proc-flags { display: inline-flex; align-items: center; justify-content: flex-end; gap: 7px; min-width: 70px; }
        .proc-flags i { font-size: 12px; color: var(--brand); }
        .icon-btn { width: 26px; height: 26px; display: inline-grid; place-items: center; flex: none; border-radius: 8px; background: var(--brand-soft); color: var(--brand); cursor: pointer; transition: background .15s, color .15s; }
        .icon-btn:hover { background: var(--brand); color: #fff; }
        .icon-btn i { font-size: 12px; }

        .part-chip { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 9px; font-size: 12.5px; font-weight: 800; color: var(--p);
            background: color-mix(in oklab, var(--p) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--p) 38%, var(--surface)); }
        .part-N { --p: var(--neck); } .part-C { --p: var(--chest); } .part-A { --p: var(--abd); } .part-M { --p: var(--msk); }

        .time-chip { --h: var(--th0); display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 9px; border-radius: 10px; font-variant-numeric: tabular-nums;
            background: color-mix(in oklab, var(--h) calc(14% + var(--s, 0) * var(--tstep)), var(--surface));
            border: 1px solid color-mix(in oklab, var(--h) 72%, var(--surface)); }
        .time-chip[data-h="1"] { --h: var(--th1); }
        .time-chip[data-h="2"] { --h: var(--th2); }
        .time-chip[data-h="3"] { --h: var(--th3); }
        .time-chip .tslots { display: inline-flex; align-items: flex-end; gap: 2px; height: 15px; flex: none; }
        .time-chip .tslots span { width: 3px; border-radius: 1px; background: color-mix(in oklab, var(--h) 28%, transparent); }
        .time-chip .tslots span.on { background: color-mix(in oklab, var(--h) 100%, #000 38%); }
        html[data-theme="dark"] .time-chip .tslots span.on { background: var(--h); }
        .time-chip .tslots span:nth-child(1) { height: 5px; }
        .time-chip .tslots span:nth-child(2) { height: 7px; }
        .time-chip .tslots span:nth-child(3) { height: 9px; }
        .time-chip .tslots span:nth-child(4) { height: 11px; }
        .time-chip .tslots span:nth-child(5) { height: 13px; }
        .time-chip .tslots span:nth-child(6) { height: 15px; }
        .time-chip select { background: transparent; border: 0; color: var(--ink); font: 700 14px/1 inherit; font-family: inherit; cursor: pointer; padding: 0 2px; }
        .time-chip.is-late { box-shadow: 0 0 0 2px var(--ink); }
        .row-done .time-chip { opacity: .62; }

        .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .chip i { font-size: 11px; }
        .chip-todo { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
        .chip-done { background: var(--done); color: var(--on-done); }
        .chip-re { background: var(--re-bar); color: var(--on-re); }
        .chip-dc { background: var(--dc); color: var(--on-dc); }

        .chk { appearance: none; -webkit-appearance: none; width: 19px; height: 19px; margin: 0; border-radius: 6px; border: 1.5px solid var(--line-strong); background: var(--surface); display: inline-grid; place-content: center; cursor: pointer; vertical-align: middle; transition: background .12s, border-color .12s, transform .1s; --c: var(--brand); --mark: #fff; }
        .chk::after { content: ''; width: 11px; height: 11px; background: var(--mark); transform: scale(0); transition: transform .12s; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
        .chk:hover { border-color: var(--c); }
        .chk:checked { background: var(--c); border-color: var(--c); }
        .chk:checked::after { transform: scale(1); }
        .chk-ok { --c: var(--done); --mark: var(--on-done); }
        .chk-re { --c: var(--re-bar); --mark: var(--on-re); }
        .chk-re::after { width: 9px; height: 9px; clip-path: circle(48% at 50% 50%); }
        .chk-dc { --c: var(--dc); --mark: var(--on-dc); }
        .chk-dc::after { width: 10px; height: 10px; clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%); }
        .chk-flag { --c: var(--ink-2); --mark: var(--surface); }

        .btn-mini { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font: 600 12.5px/1 inherit; font-family: inherit; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
        .btn-edit:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
        .btn-del:hover { background: var(--dc); border-color: var(--dc); color: var(--on-dc); }

        .empty { display: none; padding: 56px 16px; text-align: center; color: var(--ink-3); }
        .empty:not(.hidden) { display: grid; justify-items: center; gap: 6px; }
        .empty i { font-size: 34px; color: var(--line-strong); margin-bottom: 4px; }
        .empty p { margin: 0; font-size: 14.5px; font-weight: 700; color: var(--ink-2); }
        .empty span { font-size: 12.5px; }

        .toast { display: flex; align-items: center; gap: 10px; max-width: 420px; padding: 11px 16px; border-radius: 12px; background: var(--ink); color: var(--surface); font-size: 13.5px; font-weight: 600; border-left: 4px solid var(--t, var(--brand)); box-shadow: 0 14px 34px -14px rgba(0,0,0,.5); pointer-events: auto; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; }
        .toast.show { opacity: 1; transform: none; }
        .toast i { color: var(--t, var(--brand)); }
        .toast-success { --t: var(--done); } .toast-warning { --t: var(--re-bar); } .toast-error { --t: var(--dc); }
    </style>
</head>
<body class="v5">
<div class="app">

    <header class="appbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none"><path d="M16 4 L3 26 Q16 33 29 26 Z" fill="currentColor" opacity=".2"/><path d="M16 4 L3 26 Q16 33 29 26 Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M16 4 V29.4 M16 4 L9.4 27.6 M16 4 L22.6 27.6" stroke="currentColor" stroke-width="1.1" opacity=".6"/></svg>
            </span>
            <div>
                <h1>초음파 컨설트 대시보드</h1>
                <p>Produced by Ju-Hee Kang · V5.3 (실시간 연동)</p>
            </div>
        </div>

        <div class="appbar-date">
            <div class="seg" role="group">
                <button id="consultDateTodayBtn" onclick="setConsultDate(getTodayString())" class="is-active">오늘</button>
                <button id="consultDateYesterdayBtn" onclick="setConsultDate(getYesterdayString())">어제</button>
                <input type="date" id="consultDatePicker" value="" onchange="setConsultDate(this.value)">
            </div>
            <span id="consultDateLabel" class="date-label"></span>
        </div>

        <div class="appbar-actions">
            <button onclick="openSettingsModal()" class="btn btn-bar" title="설정"><i class="fa-solid fa-sliders"></i><span class="lbl">설정</span></button>
            <button onclick="toggleTheme()" id="themeBtn" class="btn btn-bar btn-bar-icon" title="화면 테마 전환"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
            <button onclick="resetData()" class="btn btn-bar btn-bar-icon btn-danger-ghost" title="데이터 전체 삭제"><i class="fa-solid fa-trash-can"></i></button>
        </div>
    </header>

    <main class="main">
        <!-- 필터 및 신규 등록 -->
        <div class="toolbar">
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="filterSearch" oninput="renderTable()" placeholder="환자명, ID, 시술내용 검색">
            </div>
            <label class="field"><span>병동</span>
                <select id="filterWard" onchange="updateFilterRoomDropdown(); renderTable()"><option value="ALL">전체</option></select>
            </label>
            <label class="field"><span>파트</span>
                <select id="filterPart" onchange="renderTable()">
                    <option value="ALL">전체</option>
                    <option value="HEAD">HEAD(NECK)</option>
                    <option value="CHEST">CHEST</option>
                    <option value="ABD">ABD</option>
                    <option value="MSK">MSK</option>
                </select>
            </label>

            <span class="toolbar-gap"></span>

            <button type="button" id="incompleteOnlyBtn" onclick="toggleIncompleteOnly()" class="filter-chip">
                <i class="fa-solid fa-filter"></i><span>미실시만 보기</span>
            </button>
        </div>

        <!-- 목록 패널 -->
        <section class="panel">
            <div class="panel-head">
                <div class="panel-title">
                    <h2><i class="fa-solid fa-list" style="color:var(--brand)"></i>초음파 의뢰 목록</h2>
                    <span id="totalBadge" class="count-badge">0건</span>
                </div>
                <button onclick="openNewModal()" class="btn-primary btn-new"><i class="fa-solid fa-plus"></i>신규 컨설트 등록</button>
            </div>

            <div class="table-scroll">
                <table id="consultTable">
                    <thead>
                        <tr>
                            <th class="t-c">파트</th>
                            <th class="t-c">순번</th>
                            <th>입력일</th>
                            <th>병동</th>
                            <th>호실</th>
                            <th>ID</th>
                            <th>환자명</th>
                            <th>시술내용</th>
                            <th class="t-c">시간</th>
                            <th class="t-c th-g1 g-start">실시</th>
                            <th class="t-c th-g1">RE</th>
                            <th class="t-c th-g1">D/C</th>
                            <th class="t-c th-g1">상태</th>
                            <th class="t-c th-g2 g-start">처방</th>
                            <th class="t-c th-g2">회신</th>
                            <th class="t-c g-start">수정</th>
                            <th class="t-c">삭제</th>
                        </tr>
                    </thead>
                    <tbody id="consultTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script>
    // =========================================================================
    // 1. Firebase 초기화 설정 (내 Firebase 정보로 수정해주세요!)
    // =========================================================================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const consultsRef = db.ref('consults');

    let consults = [];
    let selectedConsultDate = getTodayString();
    let showIncompleteOnly = false;

    // =========================================================================
    // 2. 실시간 데이터베이스 동기화 감지 (핵심!)
    // =========================================================================
    consultsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            // Firebase 객체를 배열 형태로 변환
            consults = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            }));
        } else {
            consults = [];
        }
        renderTable(); // 데이터가 변경될 때마다 전 세계 접속자의 화면 자동 갱신
    });

    function saveConsults() {
        // Firebase에 전체 데이터 업데이트
        const dataObj = {};
        consults.forEach(item => {
            dataObj[item.id] = item;
        });
        consultsRef.set(dataObj);
    }

    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    function getYesterdayString() {
        const d = new Date(); d.setDate(d.getDate() - 1);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function setConsultDate(dateStr) {
        selectedConsultDate = dateStr;
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('consultTableBody');
        if (!tbody) return;

        const filtered = consults.filter(item => {
            const matchDate = (item.date || '') === selectedConsultDate;
            const matchIncomplete = !showIncompleteOnly || (!item.ok && !item.re && !item.dc);
            return matchDate && matchIncomplete;
        });

        document.getElementById('totalBadge').innerText = `${filtered.length}건`;

        let htmlRows = '';
        filtered.forEach((item, index) => {
            htmlRows += `
                <tr>
                    <td class="c-part">${item.part || '-'}</td>
                    <td class="c-seq">${index + 1}</td>
                    <td class="c-date">${item.date || ''}</td>
                    <td class="c-ward">${item.ward || ''}</td>
                    <td class="c-room">${item.room || ''}</td>
                    <td class="c-id">${item.chartNo || ''}</td>
                    <td class="c-name">${item.name || ''}</td>
                    <td class="c-proc">${item.procedure || ''}</td>
                    <td class="c-time">${item.time || ''}</td>
                    <td class="c-chk"><input type="checkbox" ${item.ok ? 'checked' : ''} onchange="toggleCheck('${item.id}', 'ok')"></td>
                    <td class="c-chk"><input type="checkbox" ${item.re ? 'checked' : ''} onchange="toggleCheck('${item.id}', 're')"></td>
                    <td class="c-chk"><input type="checkbox" ${item.dc ? 'checked' : ''} onchange="toggleCheck('${item.id}', 'dc')"></td>
                    <td class="c-status">${item.ok ? '완료' : (item.re ? '재의뢰' : (item.dc ? '취소' : '미완료'))}</td>
                    <td class="c-chk"><input type="checkbox" ${item.rx ? 'checked' : ''} onchange="toggleCheck('${item.id}', 'rx')"></td>
                    <td class="c-chk"><input type="checkbox" ${item.reply ? 'checked' : ''} onchange="toggleCheck('${item.id}', 'reply')"></td>
                    <td class="c-act"><button onclick="deleteConsult('${item.id}')">삭제</button></td>
                </tr>
            `;
        });
        tbody.innerHTML = htmlRows;
    }

    function toggleCheck(id, key) {
        const item = consults.find(c => c.id === id);
        if (item) {
            item[key] = !item[key];
            db.ref('consults/' + id).update({ [key]: item[key] });
        }
    }

    function deleteConsult(id) {
        if (confirm("정말 삭제하시겠습니까?")) {
            db.ref('consults/' + id).remove();
        }
    }

    function resetData() {
        if (confirm("데이터베이스의 모든 컨설트 기록을 삭제하시겠습니까?")) {
            consultsRef.remove();
        }
    }

    window.onload = function() {
        document.getElementById('consultDatePicker').value = getTodayString();
    };
</script>
</body>
</html>

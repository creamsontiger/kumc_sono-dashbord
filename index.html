<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초음파 컨설트 대시보드 V5.3 (실시간 연동)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (실시간 데이터베이스 연동용) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- 깜빡임 방지: 저장된 테마를 렌더링 전에 적용 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('ultrasound_consult_dashboard_theme');
                if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>
    <!-- Pretendard Variable 폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS (Excel Library) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard Variable', 'Pretendard', 'Noto Sans KR', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #ECF0F2; --surface: #FFFFFF; --surface-2: #F4F7F8;
            --ink: #0A1A24; --ink-2: #3A4E5C; --ink-3: #66798A;
            --line: #DAE2E7; --line-strong: #B8C5CD;
            --brand: #2A56D8; --brand-soft: #E7EEFD;
            --bar: #0A1A24; --bar-ink: #E8F0F4;
            --done: #0B64B8; --on-done: #FFFFFF; --done-soft: #E3EEFA;
            --re-bar: #E8A200; --on-re: #2B1A00; --re-soft: #FFF2CC;
            --dc: #BF4A00; --on-dc: #FFFFFF; --dc-soft: #FBE7DA;
            --shadow: 0 1px 2px rgba(10,26,36,.06), 0 10px 28px -18px rgba(10,26,36,.30);
            color-scheme: light;
        }
        html[data-theme="dark"] {
            --bg: #08121A; --surface: #0E1C26; --surface-2: #132531;
            --ink: #E5EEF3; --ink-2: #A9BBC7; --ink-3: #7C909E;
            --line: #1E3140; --line-strong: #2F4859;
            --brand: #7497FF; --brand-soft: #15284F;
            --bar: #060E14; --bar-ink: #E8F0F4;
            --done: #5BB0F0; --on-done: #04162A; --done-soft: #0E2438;
            --re-bar: #F2C230; --on-re: #2B1A00; --re-soft: #33290A;
            --dc: #FF8F4D; --on-dc: #2E1100; --dc-soft: #3A1D0B;
            --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.7);
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }
        * { word-break: keep-all; }
        html, body { height: 100%; }
        body.v5 {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif;
            font-size: 14px; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased;
        }
        .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        .main { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 16px; }

        .appbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; padding: 10px 20px; background: var(--bar); color: var(--bar-ink); }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none;
            background: linear-gradient(155deg, color-mix(in oklab, var(--brand) 88%, #fff), color-mix(in oklab, var(--brand) 70%, #000)); }
        .brand-mark svg { width: 24px; height: 24px; }
        .brand h1 { font-size: 17px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; margin: 0; white-space: nowrap; }
        .brand p { font-size: 11.5px; color: color-mix(in oklab, var(--bar-ink) 60%, transparent); margin: 2px 0 0; white-space: nowrap; }
        .appbar-date { display: flex; align-items: center; gap: 8px; }
        .seg { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.08); }
        .seg button, .seg input[type=date] { height: 30px; border-radius: 9px; border: 0; background: transparent; color: var(--bar-ink); font: 600 13px/1 inherit; font-family: inherit; padding: 0 12px; cursor: pointer; }
        .seg .is-active { background: var(--surface); color: var(--ink); }
        .appbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 10px; border: 1px solid transparent; font: 600 13px/1 inherit; font-family: inherit; white-space: nowrap; cursor: pointer; }
        .btn-bar { color: var(--bar-ink); background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.10); }

        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .search { position: relative; flex: 1 1 220px; max-width: 320px; }
        .search i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 13px; pointer-events: none; }
        .search input { width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500; }
        
        .btn-primary { height: 38px; padding: 0 18px; border-radius: 12px; background: var(--brand); color: #fff; font: 700 14px/1 inherit; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }

        .panel { flex: 1; min-height: 300px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
        .panel-title { display: flex; align-items: center; gap: 10px; }
        .panel-title h2 { margin: 0; font-size: 15px; font-weight: 700; }
        .count-badge { padding: 2px 10px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 700; }

        .table-scroll { flex: 1; min-height: 0; overflow: auto; }
        #consultTable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; text-align: left; }
        #consultTable thead th { position: sticky; top: 0; z-index: 3; padding: 9px 8px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--line-strong); }
        #consultTable tbody td { padding: 8px; border-bottom: 1px solid var(--line); }
        
        .chk { width: 18px; height: 18px; cursor: pointer; }
    </style>
</head>
<body class="v5">
<div class="app">

    <header class="appbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none"><path d="M16 4 L3 26 Q16 33 29 26 Z" fill="currentColor" opacity=".2"/><path d="M16 4 L3 26 Q16 33 29 26 Z" stroke="currentColor" stroke-width="1.7"/><path d="M16 4 V29.4" stroke="currentColor" stroke-width="1.1" opacity=".6"/></svg>
            </span>
            <div>
                <h1>초음파 컨설트 대시보드</h1>
                <p>Produced by Ju-Hee Kang · V5.3 (실시간 공유 연동)</p>
            </div>
        </div>

        <div class="appbar-date">
            <div class="seg">
                <button id="consultDateTodayBtn" onclick="setConsultDate(getTodayString())" class="is-active">오늘</button>
                <button id="consultDateYesterdayBtn" onclick="setConsultDate(getYesterdayString())">어제</button>
                <input type="date" id="consultDatePicker" onchange="setConsultDate(this.value)">
            </div>
        </div>

        <div class="appbar-actions">
            <button onclick="resetData()" class="btn btn-bar" style="color: #FF8F4D;">데이터 전체 삭제</button>
        </div>
    </header>

    <main class="main">
        <div class="toolbar">
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="filterSearch" oninput="renderTable()" placeholder="환자명, ID, 시술내용 검색">
            </div>
        </div>

        <section class="panel">
            <div class="panel-head">
                <div class="panel-title">
                    <h2><i class="fa-solid fa-list" style="color:var(--brand)"></i> 초음파 의뢰 목록</h2>
                    <span id="totalBadge" class="count-badge">0건</span>
                </div>
                <button onclick="addNewConsultPrompt()" class="btn-primary"><i class="fa-solid fa-plus"></i> 신규 컨설트 등록</button>
            </div>

            <div class="table-scroll">
                <table id="consultTable">
                    <thead>
                        <tr>
                            <th>파트</th>
                            <th>순번</th>
                            <th>입력일</th>
                            <th>병동</th>
                            <th>호실</th>
                            <th>ID</th>
                            <th>환자명</th>
                            <th>시술내용</th>
                            <th>시간</th>
                            <th>실시</th>
                            <th>RE</th>
                            <th>D/C</th>
                            <th>처방</th>
                            <th>삭제</th>
                        </tr>
                    </thead>
                    <tbody id="consultTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script>
    // =========================================================================
    // Firebase 키값 연동
    // =========================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyA2pCbGOwKHimdVB4Fwy9wqQDFAhGGlH5k",
        authDomain: "consult-dashboard-v5.firebaseapp.com",
        databaseURL: "https://consult-dashboard-v5-default-rtdb.firebaseio.com",
        projectId: "consult-dashboard-v5",
        storageBucket: "consult-dashboard-v5.firebasestorage.app",
        messagingSenderId: "580857268386",
        appId: "1:580857268386:web:b16cd2dd5afbfb86d96ffb"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const consultsRef = db.ref('consults');

    let consults = [];
    let selectedConsultDate = getTodayString();

    // 실시간 동기화 (다른 사람이 고치면 내 화면도 자동으로 갱신됨)
    consultsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            consults = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            }));
        } else {
            consults = [];
        }
        renderTable();
    });

    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    function getYesterdayString() {
        const d = new Date(); d.setDate(d.getDate() - 1);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function setConsultDate(dateStr) {
        selectedConsultDate = dateStr;
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('consultTableBody');
        if (!tbody) return;

        const searchText = (document.getElementById('filterSearch').value || '').toLowerCase();

        const filtered = consults.filter(item => {
            const matchDate = (item.date || '') === selectedConsultDate;
            const matchSearch = !searchText || 
                (item.name && item.name.toLowerCase().includes(searchText)) ||
                (item.chartNo && item.chartNo.toLowerCase().includes(searchText)) ||
                (item.procedure && item.procedure.toLowerCase().includes(searchText));
            return matchDate && matchSearch;
        });

        document.getElementById('totalBadge').innerText = `${filtered.length}건`;

        let htmlRows = '';
        filtered.forEach((item, index) => {
            htmlRows += `
                <tr>
                    <td>${item.part || 'ABD'}</td>
                    <td>${index + 1}</td>
                    <td>${item.date || ''}</td>
                    <td>${item.ward || ''}</td>
                    <td>${item.room || ''}</td>
                    <td>${item.chartNo || ''}</td>
                    <td><strong>${item.name || ''}</strong></td>
                    <td>${item.procedure || ''}</td>
                    <td>${item.time || ''}</td>
                    <td><input type="checkbox" class="chk" ${item.ok ? 'checked' : ''} onchange="toggleCheck('${item.id}', 'ok')"></td>
                    <td><input type="checkbox" class="chk" ${item.re ? 'checked' : ''} onchange="toggleCheck('${item.id}', 're')"></td>
                    <td><input type="checkbox" class="chk" ${item.dc ? 'checked' : ''} onchange="toggleCheck('${item.id}', 'dc')"></td>
                    <td><input type="checkbox" class="chk" ${item.rx ? 'checked' : ''} onchange="toggleCheck('${item.id}', 'rx')"></td>
                    <td><button onclick="deleteConsult('${item.id}')" style="color:red;">삭제</button></td>
                </tr>
            `;
        });
        tbody.innerHTML = htmlRows;
    }

    function toggleCheck(id, key) {
        const item = consults.find(c => c.id === id);
        if (item) {
            item[key] = !item[key];
            db.ref('consults/' + id).update({ [key]: item[key] });
        }
    }

    function addNewConsultPrompt() {
        const name = prompt("환자명을 입력하세요:");
        if (!name) return;
        const chartNo = prompt("환자 ID(등록번호)를 입력하세요:") || "123456";
        const procedure = prompt("시술내용을 입력하세요:") || "Neck sono";

        const newRef = consultsRef.push();
        newRef.set({
            date: selectedConsultDate,
            time: "10:00",
            ward: "71W",
            room: "1호",
            chartNo: chartNo,
            name: name,
            part: "ABD",
            procedure: procedure,
            ok: false,
            re: false,
            dc: false,
            rx: false
        });
    }

    function deleteConsult(id) {
        if (confirm("정말 삭제하시겠습니까?")) {
            db.ref('consults/' + id).remove();
        }
    }

    function resetData() {
        if (confirm("데이터베이스의 모든 컨설트 기록을 삭제하시겠습니까?")) {
            consultsRef.remove();
        }
    }

    window.onload = function() {
        document.getElementById('consultDatePicker').value = getTodayString();
    };
</script>
</body>
</html>
